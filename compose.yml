name: dockgraph

services:
  dockgraph:
    build: .
    container_name: dockgraph
    restart: unless-stopped
    ports:
      # Host IP : Host Port : Container Port. Published on this host only;
      # to open it to other machines, drop "127.0.0.1:" and set DG_PASSWORD.
      - "127.0.0.1:7800:7800"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker API access
      - ./demo:/app/demo:ro                           # Demo stacks (optional)
    environment:
      DG_PORT: "7800"                                # HTTP listen port (must match container port)
      DG_POLL_INTERVAL: "30s"                        # Docker API polling interval
      DG_COMPOSE_PATH: "/app/demo/compose-small.yml" # Override: only scan this file
      DG_PASSWORD: ""                                # Password for the web UI; set it whenever the port is reachable from other machines
      # DG_ALLOWED_HOSTS: "dockgraph.example.com"    # Host names to serve besides IPs and localhost (checked without DG_PASSWORD)
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    labels:
      dockgraph.self: "true" # hides this container from the graph
