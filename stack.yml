# DockGraph for Docker Swarm.
#
#   # 1. Create the shared agent token (once per swarm, on a manager):
#   openssl rand -hex 32 | docker secret create dg_agent_token -
#
#   # 2. Deploy (on a manager):
#   docker stack deploy -c stack.yml dockgraph
#
#   # 3. Open http://<any-node>:7800
#
# `server` runs on every manager (it needs the swarm API) and serves the UI.
# The routing mesh spreads requests over the live replicas, so the UI stays
# up as long as one manager runs, with no wait for swarm to reschedule.
# `agent` runs on every node and exposes that node's container stats,
# inspect and logs to the servers over the internal overlay network only.
# Each agent is polled by every server replica (fine for 3-5 managers).
#
# Optional variables (interpolated by `docker stack deploy`):
#   DG_IMAGE      image to run (default dockgraph/dockgraph:latest)
#   DG_HTTP_PORT  published UI port (default 7800)

services:

  server:
    image: ${DG_IMAGE:-dockgraph/dockgraph:latest}
    ports:
      # Published through the routing mesh; reachable on every node.
      - "${DG_HTTP_PORT:-7800}:7800"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker API access (manager)
      # Alternative to the `configs:` below: bind-mount stack files. The path
      # must then exist on EVERY manager, or the task is rejected there.
      # - /opt/stacks/shop.yml:/stacks/shop.yml:ro
    # Optional: stack files, to show services that are not deployed yet.
    # Swarm configs are replicated to every manager. Create one first with
    # `docker config create shop_stack shop.yml`, then uncomment this and
    # the shop_stack config at the bottom of the file:
    # configs:
    #   - source: shop_stack
    #     target: /stacks/shop.yml
    environment:
      DG_MODE: "swarm"
      DG_PORT: "7800"
      DG_AGENT_ADDR: "tasks.agent"   # DNS name of every agent task in this stack
      DG_AGENT_PORT: "7801"
      DG_AGENT_TOKEN_FILE: "/run/secrets/dg_agent_token"
      # DG_SWARM_POLL_INTERVAL: "5s"
      # Require a login for the web UI and WebSocket (recommended). Either
      # inline, or from a Docker secret (create it first with
      # `printf '%s' 'pass' | docker secret create dg_password -`, then
      # uncomment the dg_password secret below and at the bottom of the file):
      # DG_PASSWORD: ""
      # DG_PASSWORD_FILE: "/run/secrets/dg_password"
      # Session cookies are signed with a key derived from the agent token,
      # shared by every replica (rotating the token logs users out). To use
      # a separate key instead (at least 32 bytes):
      # `openssl rand -hex 32 | docker secret create dg_session_key -`,
      # then uncomment this and the dg_session_key secret below and at the
      # bottom of the file:
      # DG_SESSION_KEY_FILE: "/run/secrets/dg_session_key"
      # Keep 0.0.0.0 in swarm: 127.0.0.1 would cut the routing mesh off.
      # DG_BIND_ADDR: "0.0.0.0"
      # Stack name = what you pass to `docker stack deploy`:
      # DG_COMPOSE_PATH: "shop=/stacks/shop.yml"
    secrets:
      - dg_agent_token
      # - dg_password
      # - dg_session_key
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/dockgraph", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      dockgraph.self: "true"   # container label: hides the task containers
    deploy:
      # One task per manager: no single point of failure for the UI.
      mode: global
      labels:
        dockgraph.self: "true" # service label: hides the service node
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        # One manager at a time, so the others keep serving the UI.
        parallelism: 1
        order: stop-first
        failure_action: rollback
      resources:
        limits:
          cpus: "1"
          memory: 256M

  agent:
    image: ${DG_IMAGE:-dockgraph/dockgraph:latest}
    # No published port: the agent API is only reachable on `internal`.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker API access (this node)
    environment:
      DG_MODE: "agent"
      DG_AGENT_PORT: "7801"
      DG_AGENT_TOKEN_FILE: "/run/secrets/dg_agent_token"
    secrets:
      - dg_agent_token
    networks:
      - internal
    healthcheck:
      # In agent mode the healthcheck probes DG_AGENT_PORT.
      test: ["CMD", "/dockgraph", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      dockgraph.self: "true"
    deploy:
      mode: global
      labels:
        dockgraph.self: "true"
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  internal:
    driver: overlay
    attachable: false   # only this stack's services can join
    # Uncomment to encrypt server<->agent traffic between nodes (IPsec;
    # not supported on every platform, e.g. Docker Desktop).
    # driver_opts:
    #   encrypted: "true"

secrets:
  dg_agent_token:
    external: true
  # dg_password:
  #   external: true
  # dg_session_key:
  #   external: true

