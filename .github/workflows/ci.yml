name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

# Jobs that publish test reports add checks: write for themselves.
permissions:
  contents: read # check out the repository

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: codecov
      deployment: false
    permissions:
      contents: read # check out the repository
      checks: write # publish the test report as a check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
        working-directory: backend

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Test
        run: gotestsum --junitfile=junit.xml -- -race -coverprofile=coverage.out ./...
        working-directory: backend

      # Built as release binaries are, without cgo, so that the parse child
      # can restrict its reads with Landlock.
      - name: Test compose parsing in its child process
        run: CGO_ENABLED=0 go test -count=1 ./collector -args -compose-child
        working-directory: backend

      - name: Test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Backend Test Results
          path: backend/junit.xml
          reporter: java-junit
          collapsed: auto

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          echo '## Backend Coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -15 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        working-directory: backend

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/junit.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: codecov
      deployment: false
    permissions:
      contents: read # check out the repository
      checks: write # publish the test report as a check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: |
          npx vitest run \
            --coverage \
            --coverage.reporter=lcov \
            --coverage.reporter=text \
            --coverage.reporter=html \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=junit.xml \
            2>&1 | tee test-output.txt
        working-directory: frontend

      - name: Test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Frontend Test Results
          path: frontend/junit.xml
          reporter: java-junit
          collapsed: auto

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          echo '## Frontend Coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 100 '% Stmts' test-output.txt | head -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        working-directory: frontend

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 14

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: frontend/junit.xml
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload frontend dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: backend/frontend/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dockgraph .
        working-directory: backend

      - name: Build image
        run: |
          BASE=$(grep 'FROM gcr.io/distroless' Dockerfile | awk '{print $2}')
          printf 'FROM %s\nCOPY dockgraph /dockgraph\nEXPOSE 7800\nENTRYPOINT ["/dockgraph"]\n' "$BASE" | \
            docker build -t dockgraph:test -f - backend/

      - name: Run smoke test
        run: bash test/smoke_test.sh --skip-build
